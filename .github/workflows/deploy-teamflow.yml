name: Deploy TeamFlow Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/teamflow/**'
      - 'libs/design-system/**'
      - 'infra/teamflow/**'
      - '.github/workflows/deploy-teamflow.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.teamflow
          platforms: linux/arm64
          tags: teamflow-frontend:latest
          outputs: type=docker,dest=/tmp/teamflow-frontend.tar

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY_TEAMFLOW_FRONTEND }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_TEAMFLOW_FRONTEND }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy image and compose file to Raspberry Pi
        run: |
          scp -i ~/.ssh/deploy_key /tmp/teamflow-frontend.tar \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH_TEAMFLOW_FRONTEND }}/
          scp -i ~/.ssh/deploy_key infra/teamflow/docker-compose.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH_TEAMFLOW_FRONTEND }}/docker-compose.yml

      - name: Load image and restart container
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH_TEAMFLOW_FRONTEND }} && docker load -i teamflow-frontend.tar && docker compose up -d --force-recreate"
